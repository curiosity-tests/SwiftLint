name: Test

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with leg/profile/racecar_run inputs, so racecar can
#      trigger a run and choose baseline vs instrumented. Upstream only fires on
#      push/PR, which racecar cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together (the internal pattern, cf. dummy-deployments).
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so contents: read is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. spm_macos (macos-15 / macos-26) and spm_windows (Server 2025 / 11 ARM)
#      removed: observables are gated to linux. spm_linux was the only Linux leg
#      and is the only job left, so the shared `&checkout-step` anchor has one
#      remaining user and is inlined.
#
# NOTE: spm_linux runs under `container: swift:6.3-noble`. Every step of a
# container job -- including composite actions -- executes inside that container,
# so setup-chalk-action installs co-hostd there and `make spm_test` runs in the
# same namespace. Whether that is enough for the observables is what the
# instrumented dispatch is testing; the assertion below fails the run rather than
# letting a silently-uninstrumented build be recorded.
#
# Run 33952894646 did NOT answer that question: it died at action-checkout's
# repo-visibility probe because the image has no curl (see the step below), long
# before any co-hostd install. The curl step exists to get past that and let the
# socket question actually be settled.
#
# Build and test COMMANDS are byte-identical to upstream.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:

run-name: "Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

env:
  SKIP_INTEGRATION_TESTS: 'true'
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  spm_linux:
    name: SPM, Linux, Swift 6.3
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 10
    steps:
      # swift:6.3-noble ships without curl, and action-checkout decides public
      # vs private with `curl -fsSLI <server>/<repo>`, treating a FAILED probe as
      # private. With curl absent the probe cannot run, the step still reports
      # success (the else branch writes is_private=true and `tee` exits 0), and
      # the action routes to crashappsec/setup-chalk-action-co -- a private repo
      # a public fork's GITHUB_TOKEN cannot resolve, so the job dies with
      # "Unable to resolve action ... not found" before chalk is ever installed.
      # Installing curl is what lets the correct public path be taken. Run on
      # BOTH arms, not gated on CHALK_ON, so the cost is identical in each and
      # cancels out of the comparison (the probe itself is chalk-only).
    - name: Install curl for action-checkout's repo-visibility probe
      run: apt-get update && apt-get install -y curl

    - uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
        observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS.
        lfs: false
        persist-credentials: false

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected, so an empty LD_PRELOAD inside the
      # shell is what SUCCESS looks like. pgrep is no good either -- co-hostd
      # daemonizes under another name.
    - name: Get Swift version
      id: swift_version
      run: echo "version=$(swift --version | grep '[5-9]\.[0-9]\+\(\.[0-9]\)\?' -o | head -1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        key: ubuntu-24.04-spm-${{ steps.swift_version.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
        restore-keys: ubuntu-24.04-spm-${{ steps.swift_version.outputs.version }}-
        path: .build
    - name: Run tests
      uses: ./.github/actions/run-make
      with:
        rule: spm_test
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
